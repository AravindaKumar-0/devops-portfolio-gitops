apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-portfolio
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-portfolio
                port:
                  number: 80
